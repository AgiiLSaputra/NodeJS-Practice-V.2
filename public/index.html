<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NodeMart - Toko Online Day 6</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <div class="logo">Node<span>Mart</span></div>
      <div class="nav-links">
        <a href="index.html" class="active">Katalog</a>
        <a href="admin.html">Admin</a>
      </div>
      <button class="cart-btn" onclick="openCart()">
        🛒 Keranjang
        <span class="cart-badge" id="cart-badge">0</span>
      </button>
    </div>
  </nav>

  <header class="hero container">
    <h1>Belanja Mudah di <span>NodeMart</span></h1>
    <p>Express + PostgreSQL (raw SQL) — Day 6</p>
  </header>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="search" placeholder="🔍 Cari produk..." />
      <select id="sort">
        <option value="newest">Terbaru</option>
        <option value="price_asc">Harga termurah</option>
        <option value="price_desc">Harga termahal</option>
        <option value="name">Nama A-Z</option>
      </select>
    </div>

    <div class="chips" id="chips">
      <button class="chip active" data-id="">Semua</button>
    </div>

    <div class="grid" id="product-grid">
      <div class="empty">Memuat produk...</div>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <!-- ===== Modal Keranjang ===== -->
  <div class="overlay" id="cart-overlay">
    <div class="modal">
      <button class="close" onclick="closeModal('cart-overlay')">&times;</button>
      <h2>Keranjang Belanja</h2>
      <div id="cart-items"></div>
      <div class="cart-total">
        <span>Total</span>
        <span id="cart-total">Rp 0</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('cart-overlay')">Lanjut Belanja</button>
        <button class="btn btn-primary" id="checkout-btn" onclick="openCheckout()">Checkout</button>
      </div>
    </div>
  </div>

  <!-- ===== Modal Checkout ===== -->
  <div class="overlay" id="checkout-overlay">
    <div class="modal">
      <button class="close" onclick="closeModal('checkout-overlay')">&times;</button>
      <h2>Data Pengiriman</h2>
      <form id="checkout-form">
        <div class="form-group">
          <label>Nama Lengkap *</label>
          <input type="text" name="customer_name" required maxlength="150" placeholder="Budi Santoso" />
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" name="customer_email" required maxlength="200" placeholder="budi@mail.com" />
        </div>
        <div class="form-group">
          <label>Catatan</label>
          <textarea name="notes" placeholder="Contoh: titip ke satpam"></textarea>
        </div>
        <div class="cart-total">
          <span>Total Bayar</span>
          <span id="checkout-total">Rp 0</span>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('checkout-overlay')">Kembali</button>
          <button type="submit" class="btn btn-primary">Buat Pesanan</button>
        </div>
      </form>
    </div>
  </div>

  <footer>NodeMart &copy; 2026 — Proyek pembelajaran Node.js + PostgreSQL</footer>
  <div id="toast"></div>
  <script src="js/app.js"></script>
</body>
</html>
