<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - NodeMart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav>
    <div class="container nav-inner">
      <div class="logo">Node<span>Mart</span> Admin</div>
      <div class="nav-links">
        <a href="index.html">Katalog</a>
        <a href="admin.html" class="active">Admin</a>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 30px">
    <!-- ===== Ringkasan ===== -->
    <div class="stats-grid" id="stats">
      <div class="stat-card"><div class="label">Produk Aktif</div><div class="value" id="s-products">-</div></div>
      <div class="stat-card"><div class="label">Total Stok</div><div class="value" id="s-stock">-</div></div>
      <div class="stat-card"><div class="label">Pesanan</div><div class="value" id="s-orders">-</div></div>
      <div class="stat-card"><div class="label">Menunggu Bayar</div><div class="value" id="s-pending">-</div></div>
      <div class="stat-card"><div class="label">Pendapatan</div><div class="value money" id="s-revenue">-</div></div>
    </div>

    <!-- ===== Tab ===== -->
    <div class="tabs">
      <button class="tab active" data-panel="products">Produk</button>
      <button class="tab" data-panel="categories">Kategori</button>
      <button class="tab" data-panel="orders">Pesanan</button>
    </div>

    <!-- ===== Panel Produk ===== -->
    <section class="panel active" id="panel-products">
      <div class="section-head">
        <h2>Daftar Produk</h2>
        <button class="btn btn-primary" style="width:auto" onclick="openProductForm()">+ Tambah Produk</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Stok</th><th>Status</th><th>Aksi</th></tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== Panel Kategori ===== -->
    <section class="panel" id="panel-categories">
      <div class="section-head">
        <h2>Kategori</h2>
        <button class="btn btn-primary" style="width:auto" onclick="openCategoryForm()">+ Tambah Kategori</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Nama</th><th>Deskripsi</th><th>Jumlah Produk</th><th>Aksi</th></tr></thead>
          <tbody id="category-rows"></tbody>
        </table>
      </div>
    </section>

    <!-- ===== Panel Pesanan ===== -->
    <section class="panel" id="panel-orders">
      <div class="section-head"><h2>Pesanan Masuk</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>ID</th><th>Pelanggan</th><th>Total</th><th>Item</th><th>Status</th><th>Tanggal</th><th>Aksi</th></tr></thead>
          <tbody id="order-rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ===== Modal Form Produk ===== -->
  <div class="overlay" id="product-overlay">
    <div class="modal">
      <button class="close" onclick="closeModal('product-overlay')">&times;</button>
      <h2 id="product-form-title">Tambah Produk</h2>
      <form id="product-form">
        <input type="hidden" name="id" />
        <div class="form-group">
          <label>Nama Produk *</label>
          <input type="text" name="name" required maxlength="200" />
        </div>
        <div class="form-group">
          <label>Kategori *</label>
          <select name="category_id" id="product-category" required></select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Harga (Rp) *</label>
            <input type="number" name="price" min="0" step="1000" required />
          </div>
          <div class="form-group">
            <label>Stok *</label>
            <input type="number" name="stock" min="0" required />
          </div>
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea name="description"></textarea>
        </div>
        <div class="form-group">
          <label><input type="checkbox" name="is_active" checked style="width:auto;margin-right:8px" />Produk aktif (tampil di katalog)</label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('product-overlay')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== Modal Form Kategori ===== -->
  <div class="overlay" id="category-overlay">
    <div class="modal">
      <button class="close" onclick="closeModal('category-overlay')">&times;</button>
      <h2 id="category-form-title">Tambah Kategori</h2>
      <form id="category-form">
        <input type="hidden" name="id" />
        <div class="form-group">
          <label>Nama *</label>
          <input type="text" name="name" required maxlength="100" />
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea name="description"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" onclick="closeModal('category-overlay')">Batal</button>
          <button type="submit" class="btn btn-primary">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <footer>NodeMart Admin &copy; 2026</footer>
  <div id="toast"></div>
  <script src="js/admin.js"></script>
</body>
</html>
